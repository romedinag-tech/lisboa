name: Monitoreo diario de pasajes

on:
  schedule:
    - cron: "20 14 * * *"   # 14:20 UTC = 10:20 u 11:20 en Chile
  workflow_dispatch:
    inputs:
      modo:
        description: "diario | maletas | dashboard"
        default: "diario"

permissions:
  contents: write

concurrency:
  group: monitoreo
  cancel-in-progress: false

jobs:
  monitoreo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar precios y regenerar el dashboard
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python -X utf8 monitor.py "${{ github.event.inputs.modo || 'diario' }}"
      - name: Guardar el registro
        run: |
          git config user.name "monitoreo-pasajes"
          git config user.email "monitoreo-pasajes@users.noreply.github.com"
          git add data index.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Registro $(date -u +%F)"
            git push
          fi
